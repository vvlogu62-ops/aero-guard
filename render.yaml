services:
  - type: web
    name: aeroguard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: aeroguard-db
          property: connectionString
      - key: AEROGUARD_ADMIN_EMAIL
        value: veera@aeroguard.demo
      - key: AEROGUARD_ADMIN_NAME
        value: Veera
      - key: AEROGUARD_ADMIN_PASSWORD
        generateValue: true
      - key: AEROGUARD_JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://aeroguard-kit6.onrender.com,http://localhost:5173
databases:
  - name: aeroguard-db
    databaseName: aeroguard
    user: aeroguard
    plan: free
